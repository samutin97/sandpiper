# Sandpiper's own package identity, never upstream's Microsoft Store one (Hiddify ProxyVPN,
# Hiddify.App.Win, Hiddify's Partner Center publisher): the fork is not in the Store, and an MSIX
# of it is sideloaded with a certificate trusted on each PC.
display_name: Sandpiper
publisher_display_name: Sandpiper
identity_name: Sandpiper.App.Win
msix_version: 5.9.8.0
logo_path: windows\runner\resources\app_icon.ico
capabilities: internetClient, internetClientServer, privateNetworkClientServer
languages: ar, en-us, es-es, fa-ir, fr-fr, id-id, pt-br, ru-ru, tr-tr, zh-cn, zh-tw
# H-04: one scheme, sandpiper:// (LinkParser.protocols); no hiddify, v2ray*, clash*, sing-box links
protocol_activation: sandpiper
execution_alias: sandpiper
# The package is signed with a certificate whose Subject equals `publisher`
# (windows/scripts/configure_windows_signing.ps1 checks it).
certificate_path: windows\sign.pfx
certificate_password:
publisher: CN=Sandpiper
install_certificate: "false"
enable_at_startup: "true"
startup_task:
  parameters: --autostart

# For testing with a self-signed certificate
# publisher: CN=Sandpiper-Test
# certificate_password: "1234"
# install_certificate: "true"
